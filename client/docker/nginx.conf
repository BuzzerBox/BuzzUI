server {
  listen 80;
  root /usr/share/nginx/html;

  location / {
    index index.html;
    try_files $uri $uri/ /index.html =404;
  }

  # never cache the entry page, so browsers pick up a new deployment on reload;
  # the bundles it references have hashed names and can be cached
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
