<mat-toolbar color="primary">
  <!--<button mat-icon-button class="example-icon" aria-label="Example icon-button with menu icon">
  <mat-icon>menu</mat-icon>
</button>-->
<ng-template #brand>
  <img class="logo" src="assets/images/logo.png" alt="">
  <span class="brand"><span class="brand-bold">Buzzer</span>Box</span>
</ng-template>
@if (canGoHome()) {
  <a class="home-link" [routerLink]="homeUrl" title="Zur Startseite"><ng-container *ngTemplateOutlet="brand"></ng-container></a>
} @else {
  <ng-container *ngTemplateOutlet="brand"></ng-container>
}
<span class="divider"></span>
<span>{{getName()}}</span>
<span class="example-spacer"></span>
@if (showHomeIcon) {
  <a mat-icon-button [routerLink]="homeUrl" title="Zur Startseite">
    <mat-icon>home</mat-icon>
  </a>
}
@if (showSaveIcon) {
  <mat-icon class="autosave" [class.autosave-error]="autosave?.error" [matTooltip]="getAutosaveText()" [attr.aria-label]="getAutosaveText()">
    {{!autosave?.storage ? 'cloud_off' : autosave.error ? 'sync_problem' : 'cloud_done'}}
  </mat-icon>
}
@if (showGameMenu) {
  <button mat-icon-button [matMenuTriggerFor]="gameMenu" title="Mehr">
    <mat-icon>more_vert</mat-icon>
  </button>
  <mat-menu #gameMenu="matMenu" xPosition="before">
    <button mat-menu-item (click)="openTeamsDialog()">
      <mat-icon>people</mat-icon>
      <span>Teams bearbeiten</span>
    </button>
    @if (!isGameOver()) {
      <button mat-menu-item (click)="endGame()" title="Beendet das Spiel und zeigt das gewinnende Team an">
        <mat-icon>flag</mat-icon>
        <span>Spiel beenden</span>
      </button>
      <button mat-menu-item (click)="pauseGame()" title="Speichert das Spiel, um es später unter „Spiel fortsetzen“ weiterzuspielen">
        <mat-icon>pause</mat-icon>
        <span>Spiel pausieren</span>
      </button>
      <button mat-menu-item (click)="discardGame()" title="Beendet das Spiel und löscht seinen Spielstand">
        <mat-icon>delete</mat-icon>
        <span>Spiel verwerfen</span>
      </button>
    }
  </mat-menu>
}
@if (showResetServer) {
  <button mat-icon-button (click)="resetServer()" title="Server zurücksetzen">
    <mat-icon>restart_alt</mat-icon>
  </button>
}
@if (!showGameMenu) {
  <button mat-icon-button (click)="logout()" title="Abmelden">
    <mat-icon>logout</mat-icon>
  </button>
}
</mat-toolbar>
