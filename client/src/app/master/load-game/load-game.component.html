<app-toolbar-master [showHomeIcon]="true"></app-toolbar-master>
<div class="page">
  @if (mode === 'continue') {
    <h1>Spiel fortsetzen</h1>
    <p class="hint">Wähle einen Spielstand und spiele dort weiter, wo aufgehört wurde.</p>
  } @else {
    <h1>Neues Spiel</h1>
    <p class="hint">Wähle ein gespeichertes Spiel und beginne es von vorne.</p>
  }
  <app-storage-locations (selectedChange)="location = $event"></app-storage-locations>
  @if (location) {
    <app-game-list [location]="location" [mode]="mode"></app-game-list>
  }
</div>
