<app-toolbar-master [showHomeIcon]="true"></app-toolbar-master>
<div class="page">
  <h1>Spiel starten</h1>
  <p class="hint">Wähle ein Spiel und beginne es neu, oder setze einen seiner Spielstände fort.</p>
  <app-storage-locations (selectedChange)="location = $event"></app-storage-locations>
  @if (location) {
    <app-game-list [location]="location"></app-game-list>
    <app-game-import [location]="location" (imported)="gameList?.reload()"></app-game-import>
  }
</div>
