<app-toolbar-master [showHomeIcon]="true"></app-toolbar-master>
<div class="page">
  @if (mode === 'continue') {
    <h1>{{'common.continueGame' | transloco}}</h1>
    <p class="hint">{{'loadGame.continueHint' | transloco}}</p>
  } @else {
    <h1>{{'common.newGame' | transloco}}</h1>
    <p class="hint">{{'loadGame.newHint' | transloco}}</p>
  }
  <app-storage-locations (selectedChange)="location = $event"></app-storage-locations>
  @if (location) {
    <app-game-list [location]="location" [mode]="mode"></app-game-list>
  }
</div>
