<app-toolbar-master [showHomeIcon]="true"></app-toolbar-master>
<div class="page">
  <h1>Spiele verwalten</h1>
  <p class="hint">
    Jedes Spiel hat einen eigenen Ordner mit seinen Versionen, Spielständen und Medien. Öffne ein Spiel, um es zu
    bearbeiten oder seine Medien zu verwalten.
  </p>
  <app-storage-locations (selectedChange)="location = $event"></app-storage-locations>
  @if (location) {
    <!-- side by side; what the import asks for appears below its button -->
    <div class="create">
      <button mat-flat-button color="primary" [disabled]="!location.writable" (click)="createGame()">
        <mat-icon>add</mat-icon> Neues Spiel erstellen
      </button>
      <app-game-import class="import" [location]="location" (imported)="onImported()"></app-game-import>
    </div>
    <app-game-list [location]="location" [manage]="true" (changed)="locations?.refresh()"></app-game-list>
  }
</div>
