<h1 mat-dialog-title>{{'common.endGame' | transloco}}</h1>
<div mat-dialog-content>
  <p>{{'play.confirmEnd.message' | transloco}}</p>
</div>
<div mat-dialog-actions>
  <button mat-button [mat-dialog-close]="false" cdkFocusInitial >{{'play.confirmEnd.no' | transloco}}</button>
  <button mat-button [mat-dialog-close]="true">{{'play.confirmEnd.yes' | transloco}}</button>
</div>
