<h1 mat-dialog-title>{{data.teamName}} hat gebuzzert</h1>
<div mat-dialog-content>
  <p>Wie war die Antwort?</p>
</div>
<div mat-dialog-actions class="grade-actions">
  <button mat-raised-button class="correct" [mat-dialog-close]="EGradeResults.CORRECT">Richtig (+{{formatPoints(data.points)}})</button>
  <button mat-raised-button class="wrong" [mat-dialog-close]="EGradeResults.WRONG">Falsch (−{{formatPoints(data.points)}})</button>
  <button mat-raised-button class="double" [mat-dialog-close]="EGradeResults.DOUBLE">Doppelt (+{{formatPoints(data.points * 2)}})</button>
</div>
<div mat-dialog-actions class="release-actions">
  <button mat-button [mat-dialog-close]="RELEASE_WITHOUT_GRADE" title="Gibt die Buzzer für alle Teams frei, ohne Punkte zu vergeben">Ohne Wertung freigeben</button>
</div>
