<button mat-flat-button class="buzzer-lock" [class.locked]="isLocked()" (click)="release()"
        [title]="(isLocked() ? 'play.lock.releaseHint' : 'play.lock.freeHint') | transloco">
  <mat-icon>{{isLocked() ? 'lock' : 'lock_open'}}</mat-icon>
  <span class="labels">
    <span class="label">{{(isLocked() ? 'play.lock.release' : 'play.lock.free') | transloco}}</span>
    @if (isLocked() && getBuzzedTeamName(); as teamName) {
      <span class="team">{{'play.lock.buzzed' | transloco: {team: teamName} }}</span>
    }
  </span>
</button>
@if (isLocked() && getBuzzedTeamName()) {
  <!-- after the grade dialog was closed with "Später bewerten" -->
  <button mat-flat-button class="grade" (click)="grade()" [title]="'play.lock.gradeHint' | transloco">
    <mat-icon>rule</mat-icon>
    {{'play.lock.grade' | transloco}}
  </button>
}
