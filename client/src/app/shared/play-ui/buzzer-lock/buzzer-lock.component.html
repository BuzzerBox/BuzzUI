<button mat-flat-button class="buzzer-lock" [class.locked]="isLocked()" (click)="release()"
        [title]="isLocked() ? 'Die Buzzer für alle Teams freigeben' : 'Die Buzzer sind frei; gibt sie trotzdem noch einmal frei'">
  <mat-icon>{{isLocked() ? 'lock' : 'lock_open'}}</mat-icon>
  <span class="labels">
    <span class="label">{{isLocked() ? 'Buzzer freigeben' : 'Buzzer frei'}}</span>
    @if (isLocked() && getBuzzedTeamName(); as teamName) {
      <span class="team">{{teamName}} hat gebuzzert</span>
    }
  </span>
</button>
@if (isLocked() && getBuzzedTeamName()) {
  <!-- after the grade dialog was closed with "Später bewerten" -->
  <button mat-stroked-button class="grade" (click)="grade()" title="Die Antwort des Teams, das gebuzzert hat, bewerten">
    <mat-icon>rule</mat-icon>
    Bewerten
  </button>
}
