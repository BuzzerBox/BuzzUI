<mat-nav-list>
  @if (isAlreadyLoggedIn()) {
    <a mat-list-item (click)="logOutAnswer()">Auswahl aufheben</a>
  }
  @if (!isAlreadyLoggedIn()) {
    <a mat-list-item (click)="logInAnswer()">Antwort selektieren</a>
  }
  <a mat-list-item (click)="activateAnswer()">Antwort aufdecken</a>
</mat-nav-list>
