<mat-nav-list>
  @if (isAlreadyLoggedIn()) {
    <a mat-list-item (click)="logOutAnswer()">{{'play.answerOptions.unselect' | transloco}}</a>
  }
  @if (!isAlreadyLoggedIn()) {
    <a mat-list-item (click)="logInAnswer()">{{'play.answerOptions.select' | transloco}}</a>
  }
  <a mat-list-item (click)="activateAnswer()">{{'play.answerOptions.reveal' | transloco}}</a>
</mat-nav-list>
