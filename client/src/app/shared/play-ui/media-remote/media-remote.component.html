<!-- in the question pane's "Mediensteuerung" box, which also names the media -->
<div class="media-controls large-controls">
  <div class="media-buttons">
    <!-- video and audio are played here; images are shown and hidden in the visibility pane -->
    @if (isPlayable()) {
      <button mat-stroked-button class="media-button" (click)="isPlaying() ? pause() : play()" [title]="isPlaying() ? 'Auf der Anzeige pausieren' : 'Auf der Anzeige abspielen'">
        <mat-icon>{{ isPlaying() ? 'pause' : 'play_arrow' }}</mat-icon> {{ isPlaying() ? 'Pausieren' : 'Abspielen' }}
      </button>
    }
    @if (isSlideshow()) {
      <button mat-stroked-button class="media-button" (click)="previousSlide()" [disabled]="getSlideIndex() === 0" title="Vorheriges Bild">
        <mat-icon>skip_previous</mat-icon> Vorheriges Bild
      </button>
      <button mat-stroked-button class="media-button" (click)="nextSlide()" [disabled]="isFinished()" [title]="getNextSlideTitle()">
        <mat-icon>skip_next</mat-icon> {{getNextSlideLabel()}}
      </button>
    }
    @if (isPlayable() || isSlideshow()) {
      <button mat-stroked-button class="media-button" (click)="replay()" title="Von vorne beginnen">
        <mat-icon>replay</mat-icon> Von vorne
      </button>
    }
    @if (isPlayable()) {
      <!-- the sound and its volume in one box, like a button -->
      <span class="volume-control" role="group" aria-label="Ton">
        <button mat-icon-button (click)="toggleMute()" [title]="mediaVolume.muted ? 'Ton einschalten' : 'Ton ausschalten'"
          [attr.aria-label]="mediaVolume.muted ? 'Ton einschalten' : 'Ton ausschalten'">
          <mat-icon>{{ mediaVolume.muted ? 'volume_off' : 'volume_up' }}</mat-icon>
        </button>
        <mat-slider min="0" max="100" step="5" discrete title="Lautstärke auf allen Anzeigegeräten">
          <input matSliderThumb [value]="getVolumePercent()" (valueChange)="setVolume($event)"
            (dragStart)="onVolumeDragStart()" (dragEnd)="onVolumeDragEnd()">
        </mat-slider>
      </span>
    }
    <!-- audio only shows its note -->
    @if (!isAudio()) {
      <button mat-stroked-button class="media-button" (click)="toggleFullscreen()" [title]="isFullscreen() ? 'Vollbild auf der Anzeige beenden' : 'Medium auf der Anzeige im Vollbild zeigen'">
        <mat-icon>{{ isFullscreen() ? 'fullscreen_exit' : 'fullscreen' }}</mat-icon> {{ isFullscreen() ? 'Vollbild beenden' : 'Vollbild' }}
      </button>
    }
  </div>
  @if (isSlideshow()) {
    <div class="slide-position" [class.finished]="isFinished()" [title]="isFinished() ? 'Bildserie abgeschlossen' : ''">
      <span>Bildserie</span>
      <span>
        {{getSlideIndex() + 1}} / {{getSlideCount()}}
        @if (isFinished()) {
          <mat-icon>check_circle</mat-icon>
        }
      </span>
    </div>
  }
</div>
