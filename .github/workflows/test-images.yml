# Builds the server and client images for the test environment.
# Pushes to main publish them to GHCR as :test (plus :test-<sha>); pull requests only check that they build.
# The test host picks up new :test images on its own (see deploy/test/).
name: Test environment images

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [server, client]
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: image
        # GHCR image names must be lowercase
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.component }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.component }}/docker/Dockerfile
          build-args: CONFIG_OVERRIDE=config.test.json
          # add linux/arm64 here if the test host is a Pi or another ARM machine (builds take longer under emulation)
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.image.outputs.name }}:test
            ${{ steps.image.outputs.name }}:test-${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
