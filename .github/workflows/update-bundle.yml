# Builds the USB update bundle (scripts/create-update-bundle.sh). Tags v<version> build it signed with the key in the
# update-signing environment and attach it to their GitHub release; the tag has to match version.json. Pull requests
# only check that a bundle builds, signed with a throwaway key that no box accepts.
name: Update bundle

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - client/**
      - server/**
      - shared/**
      - scripts/**
      - install/.assets/**
      - config.json
      - version.json
      - .github/workflows/update-bundle.yml
  workflow_dispatch:

concurrency:
  group: update-bundle-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # the Node.js that the box runs (provisioning/group_vars/all.yml)
          node-version: 24.21.0

      - name: Create the dev config that the builds import
        run: cp config.dev.json.example config.dev.json

      - name: Build a bundle with a throwaway key
        run: |
          node scripts/update-signing.js generate-key "${RUNNER_TEMP}/test-private.pem" "${RUNNER_TEMP}/test-public.pem"
          BUZZERBOX_UPDATE_PUBLIC_KEY="${RUNNER_TEMP}/test-public.pem" \
            scripts/create-update-bundle.sh "${RUNNER_TEMP}/test-private.pem"

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # holds the signing key; limit it to v* tags (and optionally require a review) in the repository settings
    environment: update-signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Check that the tag matches version.json
        id: version
        run: |
          version="$(node -p "require('./version.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::The tag ${GITHUB_REF_NAME} does not match version ${version} in version.json"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Create the dev config that the builds import
        run: cp config.dev.json.example config.dev.json

      - name: Build the signed bundle
        env:
          SIGNING_KEY: ${{ secrets.BUZZERBOX_UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "${SIGNING_KEY}" ]; then
            echo "::error::The update-signing environment has no BUZZERBOX_UPDATE_SIGNING_KEY secret"
            exit 1
          fi
          if [ ! -f install/.assets/update-public-key.pem ]; then
            echo "::error::install/.assets/update-public-key.pem is missing, so boxes could not check the bundle"
            exit 1
          fi
          key_file="${RUNNER_TEMP}/update-signing-key.pem"
          trap 'rm -f "${key_file}"' EXIT
          (umask 077 && printf '%s\n' "${SIGNING_KEY}" > "${key_file}")
          # checks the signature against install/.assets/update-public-key.pem
          scripts/create-update-bundle.sh "${key_file}"

      - uses: actions/upload-artifact@v4
        with:
          name: buzzerbox-update-${{ steps.version.outputs.version }}
          path: updates/buzzerbox-update-${{ steps.version.outputs.version }}.tar
          # the payload is already compressed
          compression-level: 0

      - name: Attach the bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the image workflow may create the release at the same time
          gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --verify-tag --title "${GITHUB_REF_NAME}" --generate-notes \
            || gh release view "${GITHUB_REF_NAME}" > /dev/null
          gh release upload "${GITHUB_REF_NAME}" "updates/buzzerbox-update-${{ steps.version.outputs.version }}.tar" --clobber
