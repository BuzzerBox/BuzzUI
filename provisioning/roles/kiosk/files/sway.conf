# The BuzzerBox kiosk (roles/kiosk): no bar, no borders and no key bindings, so that nothing but the browsers shows and
# nobody can leave them. buzzerbox-kiosk-session puts them on the outputs.
xwayland disable
default_border none
default_floating_border none
focus_follows_mouse no

# the invisible cursor theme, see roles/kiosk/tasks/main.yml. Sway also hides the cursor while the touch display is used.
seat * xcursor_theme default
seat * hide_cursor 1000

input type:keyboard xkb_layout de

exec /usr/local/bin/buzzerbox-kiosk-session
