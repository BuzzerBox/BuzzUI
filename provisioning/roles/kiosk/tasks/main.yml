# The screen: Chromium in kiosk mode on the HDMI output, in the sway Wayland compositor. There is no desktop. On a box
# with a touch display (TOUCH_DISPLAY in buzzerbox.txt), the master runs on that display too, with an on-screen keyboard.

- name: Install Chromium and the audio stack
  ansible.builtin.apt:
    # PipeWire plays the media's audio over HDMI; wlr-randr switches sway's HDMI output off and on for the HDMI sound,
    # see files/buzzerbox-hdmi-audio
    name: [chromium, pipewire, pipewire-pulse, wireplumber, wlr-randr, fonts-noto-color-emoji]
    update_cache: true
    cache_valid_time: 3600

# without its recommendations (wallpapers, a terminal, a screen locker), which the kiosk doesn't use. squeekboard
# needs the session's D-Bus, and its settings below need glib-compile-schemas (libglib2.0-bin) and dconf (dconf-cli).
- name: Install sway and the on-screen keyboard
  ansible.builtin.apt:
    name: [sway, squeekboard, dbus-user-session, libglib2.0-bin, dconf-cli]
    install_recommends: false
    update_cache: true
    cache_valid_time: 3600

# the compositor of the kiosk before there was a touch display, which can only show one browser
- name: Remove cage
  ansible.builtin.apt:
    name: cage
    state: absent

- name: Install the configuration of sway
  ansible.builtin.copy:
    src: sway.conf
    dest: /etc/buzzerbox/sway.conf
    mode: "0644"

- name: Install the script that starts the browsers
  ansible.builtin.copy:
    src: buzzerbox-kiosk-session.sh
    dest: /usr/local/bin/buzzerbox-kiosk-session
    mode: "0755"

# Chromium's own menus and pages are no use in the kiosk, and someone at the touch display could leave the master with
# them: the developer tools, dialogs for files and printing, other profiles, and Chromium's pages. A long press still
# opens Chromium's context menu, which the client suppresses on the box's display (KioskHelper); these keep what is in
# it harmless.
- name: Create the directory of Chromium's policies
  ansible.builtin.file:
    path: /etc/chromium/policies/managed
    state: directory
    mode: "0755"

- name: Lock Chromium down for the kiosk
  ansible.builtin.copy:
    dest: /etc/chromium/policies/managed/buzzerbox-kiosk.json
    content: "{{ policies | to_nice_json }}\n"
    mode: "0644"
  vars:
    policies:
      # 2: not even for extensions or chrome:// pages
      DeveloperToolsAvailability: 2
      AllowFileSelectionDialogs: false
      PrintingEnabled: false
      TranslateEnabled: false
      EnableMediaRouter: false
      BrowserGuestModeEnabled: false
      BrowserAddPersonEnabled: false
      PasswordManagerEnabled: false
      LensRegionSearchEnabled: false
      URLBlocklist: ["chrome://*", "chrome-untrusted://*", "devtools://*", "view-source:*", "file://*"]

# squeekboard only shows itself for text fields while the screen keyboard is enabled in GSettings. The kiosk has no
# settings of its own, so this becomes the default.
- name: Enable the on-screen keyboard
  ansible.builtin.copy:
    dest: /usr/share/glib-2.0/schemas/90_buzzerbox.gschema.override
    content: |
      [org.gnome.desktop.a11y.applications]
      screen-keyboard-enabled=true
    mode: "0644"
  register: gschema_override

- name: Compile the GSettings schemas
  ansible.builtin.command: glib-compile-schemas /usr/share/glib-2.0/schemas
  when: gschema_override.changed

# It takes its layout from the input sources, which Raspberry Pi OS sets in its system dconf database
# (local.d/00_keyboard, written by raspi-config from the system keyboard, "gb"). That beats the schema's defaults, so
# the German layout goes into the same database, in a file read after Raspberry Pi's.
- name: Create the directory of the system dconf database
  ansible.builtin.file:
    path: /etc/dconf/db/local.d
    state: directory
    mode: "0755"

- name: Give the on-screen keyboard a German layout
  ansible.builtin.copy:
    dest: /etc/dconf/db/local.d/90_buzzerbox-keyboard
    content: |
      [org/gnome/desktop/input-sources]
      sources=[('xkb', 'de')]
    mode: "0644"
  register: dconf_keyboard

- name: Compile the system dconf database
  ansible.builtin.command: dconf update
  when: dconf_keyboard.changed

- name: Install the PAM configuration of the kiosk session
  ansible.builtin.copy:
    src: buzzerbox-kiosk.pam
    dest: /etc/pam.d/buzzerbox-kiosk
    mode: "0644"

# The compositor draws a mouse cursor, even without a mouse. The kiosk gets its own XCURSOR_PATH with a "default" theme
# (sway.conf) whose cursor is one transparent pixel (files/hidden-cursor, an Xcursor file). Chromium inherits it, so a
# mouse plugged in stays invisible too.
- name: Create the directory of the cursor theme
  ansible.builtin.file:
    path: /usr/share/buzzerbox/cursors/default/cursors
    state: directory
    mode: "0755"

- name: Install the invisible cursor theme
  ansible.builtin.copy:
    src: hidden-cursor
    dest: /usr/share/buzzerbox/cursors/default/cursors/default
    mode: "0644"

- name: Use it for the other cursor names
  ansible.builtin.file:
    src: default
    dest: "/usr/share/buzzerbox/cursors/default/cursors/{{ item }}"
    state: link
  loop: [left_ptr, arrow, pointer, text, xterm, hand2, crosshair]

- name: Describe the cursor theme
  ansible.builtin.copy:
    dest: /usr/share/buzzerbox/cursors/default/index.theme
    content: |
      [Icon Theme]
      Name=default
      Comment=An invisible mouse cursor for the BuzzerBox kiosk
    mode: "0644"

# WirePlumber picks the HDMI card's profile when it starts, and without a TV that is "off". It doesn't switch the
# profile again by itself (api.acp.auto-profile is false by default), so a TV switched on after the box stayed silent.
# Its default volume of 40 % is raised to 100 %: the master and the TV set how loud it is.
- name: Create the directory of WirePlumber's settings
  ansible.builtin.file:
    path: /etc/wireplumber/wireplumber.conf.d
    state: directory
    mode: "0755"

- name: Switch the HDMI sound on when a TV is connected later, at full volume
  ansible.builtin.copy:
    dest: /etc/wireplumber/wireplumber.conf.d/50-buzzerbox-hdmi.conf
    content: |
      # see provisioning/roles/kiosk: the HDMI cards switch from "off" to HDMI by themselves when a TV reports in,
      # at full volume
      wireplumber.settings = {
        device.routes.default-sink-volume = 1.0
      }
      monitor.alsa.rules = [
        {
          matches = [ { device.name = "~alsa_card\\.platform-.*\\.hdmi" } ]
          actions = { update-props = { api.acp.auto-profile = true, api.acp.auto-port = true } }
        }
      ]
    mode: "0644"

# Whenever the TV reports in, WirePlumber probes the HDMI card before the HDMI output is switched on again, which it
# needs for sound, so the kiosk and every HDMI hotplug let it probe the card again afterwards and switch
# the output off and on, since the TV only plays sound when the output is switched on with the sound running
# (files/buzzerbox-hdmi-audio)
- name: Install the script that brings back the HDMI sound
  ansible.builtin.copy:
    src: buzzerbox-hdmi-audio
    dest: /usr/share/buzzerbox/buzzerbox-hdmi-audio
    mode: "0755"

- name: Install its service
  ansible.builtin.template:
    src: buzzerbox-hdmi-audio.service.j2
    dest: /etc/systemd/system/buzzerbox-hdmi-audio.service
    mode: "0644"

- name: Run it on every HDMI hotplug
  ansible.builtin.copy:
    src: 99-buzzerbox-hdmi-audio.rules
    dest: /etc/udev/rules.d/99-buzzerbox-hdmi-audio.rules
    mode: "0644"

- name: Install the kiosk service
  ansible.builtin.template:
    src: buzzerbox-kiosk.service.j2
    dest: /etc/systemd/system/buzzerbox-kiosk.service
    mode: "0644"

- name: Enable the kiosk service
  ansible.builtin.systemd_service:
    name: buzzerbox-kiosk.service
    enabled: true
    daemon_reload: "{{ not ansible_facts.is_chroot }}"

- name: Boot into the kiosk
  ansible.builtin.file:
    src: /usr/lib/systemd/system/graphical.target
    dest: /etc/systemd/system/default.target
    state: link
