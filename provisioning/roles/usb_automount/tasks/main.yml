# USB sticks are mounted at /media/<user>/<label> as soon as they are plugged in, like on the old desktop image. The
# server lists media and update bundles from there (fileServer.localPath in config.json).

- name: Install udisks2 and udiskie
  ansible.builtin.apt:
    name: [udisks2, udiskie]
    install_recommends: false
    update_cache: true
    cache_valid_time: 3600

# udisks2 asks polkit, which only lets users of an active desktop session mount. The box has no such session.
- name: Let the user mount USB sticks
  ansible.builtin.template:
    src: 50-buzzerbox-udisks.rules.j2
    dest: /etc/polkit-1/rules.d/50-buzzerbox-udisks.rules
    mode: "0644"

- name: Install the automount service
  ansible.builtin.template:
    src: buzzerbox-automount.service.j2
    dest: /etc/systemd/system/buzzerbox-automount.service
    mode: "0644"

- name: Enable the automount service
  ansible.builtin.systemd_service:
    name: buzzerbox-automount.service
    enabled: true
    daemon_reload: "{{ not ansible_facts.is_chroot }}"
